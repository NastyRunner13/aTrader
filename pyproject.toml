[project]
name = "atrader"
version = "0.1.0"
description = "Evidence-linked research agents for Indian listed equities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<1",
    "pandas>=3.0,<4",
    "numpy>=2.5,<3",
    "typer>=0.27,<1",
    "platformdirs>=4.12,<5",
    "defusedxml>=0.7,<1",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
atrader = "atrader.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "respx>=0.23",
    "ruff>=0.16",
    "mypy>=2.4",
    "pandas-stubs",
    "types-defusedxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test reaches a real external service (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913",  # agent/node factories legitimately take several collaborators
    "PLR2004",  # thresholds live next to their documented rule
    "RUF001",   # ₹ and en dash in user-facing strings are intentional
    "N818",     # exception names read as states (QuotaExhausted), not "...Error"
    "B008",     # typer declares options as argument defaults
    "PLR0911",  # early returns read clearer than nested conditions here
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# Agents follow TradingAgents' style: small untyped `create_<agent>(llm)` factories.
[[tool.mypy.overrides]]
module = ["atrader.agents.*", "atrader.graph.setup", "atrader.graph.nodes"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["atrader.graph.research_graph"]
disallow_untyped_calls = false
